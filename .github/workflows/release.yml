name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test
      - name: "Pack packages (rewrites workspace: protocol to real versions)"
        run: pnpm -r pack
      - name: Publish to npm via OIDC trusted publishing
        run: |
          shopt -s nullglob
          for tgz in mu-*.tgz; do
            echo "Publishing $tgz"
            npm publish "$tgz" --access public
          done

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install ldid (ad-hoc signs the macOS binaries so Gatekeeper allows them)
        run: |
          sudo curl -fsSL https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
      - name: Cross-compile standalone binaries
        run: pnpm compile
      - name: Attach binaries to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mu-*
